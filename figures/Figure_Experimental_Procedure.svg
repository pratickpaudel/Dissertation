<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1200" viewBox="0 0 660 1200" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="660" height="1200" fill="#ffffff"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- 1. Dataset Loading -->
  <ellipse cx="320" cy="55" rx="150" ry="38" fill="#eaf2fb" stroke="#2c3e66" stroke-width="2"/>
  <text x="320" y="52" text-anchor="middle" font-size="15" fill="#1a1a1a">Dataset Loading</text>
  <text x="320" y="70" text-anchor="middle" font-size="11" fill="#555555">(UCI &amp; Hannousse-Yahiouche)</text>

  <line x1="320" y1="93" x2="320" y2="127" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Data Preprocessing -->
  <ellipse cx="320" cy="165" rx="140" ry="38" fill="#eaf2fb" stroke="#2c3e66" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-size="15" fill="#1a1a1a">Data Preprocessing</text>

  <line x1="320" y1="203" x2="320" y2="237" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Train-Test Split -->
  <ellipse cx="320" cy="280" rx="180" ry="44" fill="#eaf2fb" stroke="#2c3e66" stroke-width="2"/>
  <text x="320" y="274" text-anchor="middle" font-size="15" fill="#1a1a1a">Stratified 80/20 Train-Test Split</text>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="#555555">(random state = 42; test set remains untouched)</text>

  <!-- Arrow to imbalance box, emphasising training set only -->
  <line x1="320" y1="324" x2="320" y2="360" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="333" y="347" text-anchor="start" font-size="11" font-weight="bold" font-style="italic" fill="#b03a2e">training set only</text>

  <!-- 4. Imbalance techniques box -->
  <rect x="25" y="366" width="590" height="196" rx="18" ry="18" fill="#fbf5ea" stroke="#8a6d3b" stroke-width="2"/>
  <text x="320" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c4a29">Imbalance Treatment Techniques</text>

  <!-- Row 1 -->
  <ellipse cx="99" cy="450" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="99" y="447" text-anchor="middle" font-size="11" fill="#1a1a1a">Random</text>
  <text x="99" y="460" text-anchor="middle" font-size="11" fill="#1a1a1a">Oversampling</text>

  <ellipse cx="246" cy="450" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="246" y="447" text-anchor="middle" font-size="11" fill="#1a1a1a">Random</text>
  <text x="246" y="460" text-anchor="middle" font-size="11" fill="#1a1a1a">Undersampling</text>

  <ellipse cx="393" cy="450" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="393" y="455" text-anchor="middle" font-size="13" fill="#1a1a1a">SMOTE</text>

  <ellipse cx="540" cy="450" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="540" y="455" text-anchor="middle" font-size="13" fill="#1a1a1a">ADASYN</text>

  <!-- Row 2 -->
  <ellipse cx="123" cy="520" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="123" y="525" text-anchor="middle" font-size="13" fill="#1a1a1a">SMOTEENN</text>

  <ellipse cx="320" cy="520" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="320" y="525" text-anchor="middle" font-size="13" fill="#1a1a1a">SMOTETomek</text>

  <ellipse cx="517" cy="520" rx="68" ry="32" fill="#ffffff" stroke="#8a6d3b" stroke-width="1.8"/>
  <text x="517" y="517" text-anchor="middle" font-size="11" fill="#1a1a1a">Cost-Sensitive</text>
  <text x="517" y="530" text-anchor="middle" font-size="11" fill="#1a1a1a">Learning</text>

  <!-- Arrow with "select imbalance technique" label -->
  <line x1="320" y1="562" x2="320" y2="612" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="592" text-anchor="start" font-size="12" font-style="italic" fill="#555555">select imbalance technique</text>

  <!-- 5. Classifier Selection -->
  <ellipse cx="320" cy="654" rx="185" ry="42" fill="#eafbf0" stroke="#2e6b46" stroke-width="2"/>
  <text x="320" y="649" text-anchor="middle" font-size="15" fill="#1a1a1a">Classifier Selection</text>
  <text x="320" y="668" text-anchor="middle" font-size="11" fill="#555555">(Decision Tree, Random Forest, Support Vector Machine)</text>

  <line x1="320" y1="696" x2="320" y2="730" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Model Training & Hyperparameter Optimisation -->
  <ellipse cx="320" cy="782" rx="185" ry="50" fill="#eafbf0" stroke="#2e6b46" stroke-width="2"/>
  <text x="320" y="769" text-anchor="middle" font-size="15" fill="#1a1a1a">Model Training &amp;</text>
  <text x="320" y="787" text-anchor="middle" font-size="15" fill="#1a1a1a">Hyperparameter Optimisation</text>
  <text x="320" y="805" text-anchor="middle" font-size="11" fill="#555555">(stratified 5-fold cross-validation)</text>

  <line x1="320" y1="832" x2="320" y2="866" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. Evaluation -->
  <ellipse cx="320" cy="908" rx="195" ry="42" fill="#eafbf0" stroke="#2e6b46" stroke-width="2"/>
  <text x="320" y="903" text-anchor="middle" font-size="15" fill="#1a1a1a">Evaluation on Test Set</text>
  <text x="320" y="922" text-anchor="middle" font-size="11" fill="#555555">(Precision, Recall, F1-score, ROC-AUC, PR-AUC, MCC)</text>

  <line x1="320" y1="950" x2="320" y2="984" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Comparative Performance Analysis -->
  <ellipse cx="320" cy="1022" rx="180" ry="38" fill="#f3eafb" stroke="#5a3d7a" stroke-width="2"/>
  <text x="320" y="1027" text-anchor="middle" font-size="15" fill="#1a1a1a">Comparative Performance Analysis</text>

  <line x1="320" y1="1060" x2="320" y2="1094" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9. Statistical Significance Testing -->
  <ellipse cx="320" cy="1138" rx="185" ry="42" fill="#f3eafb" stroke="#5a3d7a" stroke-width="2"/>
  <text x="320" y="1133" text-anchor="middle" font-size="15" fill="#1a1a1a">Statistical Significance Testing</text>
  <text x="320" y="1152" text-anchor="middle" font-size="11" fill="#555555">(McNemar's Test, p &lt; 0.05)</text>

  <!-- Repeat loop: from Model Training area back up to techniques box -->
  <path d="M 505 782 C 628 782, 632 462, 616 462" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="640" y="622" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b03a2e" transform="rotate(90 640 622)">Repeat for each Dataset &#215; Imbalance Technique &#215; Classifier</text>

</svg>
