<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b03a2e"/>
    </marker>
  </defs>

  <!-- ===== Dataset-specific branches ===== -->
  <text x="380" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#444444">Dataset-specific handling</text>

  <rect x="50" y="42" width="300" height="118" rx="10" fill="#eaf2fb" stroke="#2c3e66" stroke-width="2"/>
  <text x="200" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b4a">Vrbancic et al. (2020)</text>
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#555555">88,647 rows | 111 features</text>
  <text x="200" y="100" text-anchor="middle" font-size="11" fill="#555555">34.57% phishing (1:1.89)</text>
  <line x1="70" y1="112" x2="330" y2="112" stroke="#a8bcd8" stroke-width="1"/>
  <text x="200" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">Target column: phishing</text>
  <text x="200" y="147" text-anchor="middle" font-size="11" fill="#555555">all features already numeric</text>

  <rect x="410" y="42" width="300" height="118" rx="10" fill="#eaf2fb" stroke="#2c3e66" stroke-width="2"/>
  <text x="560" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2b4a">URL-Phish (2025)</text>
  <text x="560" y="84" text-anchor="middle" font-size="11" fill="#555555">116,600 rows | 22 features</text>
  <text x="560" y="100" text-anchor="middle" font-size="11" fill="#555555">14.24% phishing (1:6.02)</text>
  <line x1="430" y1="112" x2="690" y2="112" stroke="#a8bcd8" stroke-width="1"/>
  <text x="560" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">Target column: label</text>
  <text x="560" y="147" text-anchor="middle" font-size="11" fill="#555555">drop url, dom, tld identifiers</text>

  <!-- converge -->
  <line x1="200" y1="160" x2="200" y2="182" stroke="#333333" stroke-width="2"/>
  <line x1="560" y1="160" x2="560" y2="182" stroke="#333333" stroke-width="2"/>
  <line x1="200" y1="182" x2="560" y2="182" stroke="#333333" stroke-width="2"/>
  <line x1="380" y1="182" x2="380" y2="212" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Common pipeline ===== -->
  <text x="380" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#444444">Applied identically to both datasets</text>

  <!-- Step 1: label convention -->
  <rect x="150" y="252" width="460" height="58" rx="8" fill="#fbf5ea" stroke="#8a6d3b" stroke-width="2"/>
  <text x="380" y="274" text-anchor="middle" font-size="13" fill="#1a1a1a">Map labels to a single convention</text>
  <text x="380" y="294" text-anchor="middle" font-size="11" fill="#555555">phishing = positive class (1), legitimate = 0</text>

  <line x1="380" y1="310" x2="380" y2="342" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: structural cleaning -->
  <rect x="150" y="348" width="460" height="72" rx="8" fill="#fbf5ea" stroke="#8a6d3b" stroke-width="2"/>
  <text x="380" y="370" text-anchor="middle" font-size="13" fill="#1a1a1a">Structural cleaning</text>
  <text x="380" y="389" text-anchor="middle" font-size="11" fill="#555555">remove zero-variance and duplicated columns</text>
  <text x="380" y="406" text-anchor="middle" font-size="11" fill="#555555">replace non-finite values (neither dataset has missing values)</text>

  <line x1="380" y1="420" x2="380" y2="452" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: subsample -->
  <rect x="150" y="458" width="460" height="78" rx="8" fill="#fbf5ea" stroke="#8a6d3b" stroke-width="2"/>
  <text x="380" y="480" text-anchor="middle" font-size="13" fill="#1a1a1a">Stratified subsample to 20,000 rows</text>
  <text x="380" y="499" text-anchor="middle" font-size="11" fill="#555555">proportional within each class, so the natural ratio is preserved</text>
  <text x="380" y="518" text-anchor="middle" font-size="11" fill="#2e6b46">Vrbancic 34.57% | URL-Phish 14.23% after reduction</text>
  <text x="380" y="531" text-anchor="middle" font-size="10" font-style="italic" fill="#777777">volume reduced only, to keep SVM training tractable</text>

  <line x1="380" y1="536" x2="380" y2="568" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: split -->
  <rect x="150" y="574" width="460" height="72" rx="8" fill="#fbf5ea" stroke="#8a6d3b" stroke-width="2"/>
  <text x="380" y="596" text-anchor="middle" font-size="13" fill="#1a1a1a">Stratified 80/20 train-test split</text>
  <text x="380" y="615" text-anchor="middle" font-size="11" fill="#555555">class proportion preserved in both partitions</text>
  <text x="380" y="632" text-anchor="middle" font-size="11" fill="#555555">seed controls the draw (42, 1 or 2)</text>

  <!-- split into two -->
  <line x1="380" y1="646" x2="380" y2="668" stroke="#333333" stroke-width="2"/>
  <line x1="205" y1="668" x2="555" y2="668" stroke="#333333" stroke-width="2"/>
  <line x1="205" y1="668" x2="205" y2="698" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="555" y1="668" x2="555" y2="698" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Training branch -->
  <rect x="60" y="704" width="290" height="70" rx="8" fill="#eafbf0" stroke="#2e6b46" stroke-width="2"/>
  <text x="205" y="726" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4a30">Training set (16,000)</text>
  <text x="205" y="745" text-anchor="middle" font-size="11" fill="#555555">passed to imbalance treatment</text>
  <text x="205" y="762" text-anchor="middle" font-size="11" fill="#555555">and cross-validation</text>

  <!-- Test branch -->
  <rect x="410" y="704" width="290" height="70" rx="8" fill="#fdeceb" stroke="#b03a2e" stroke-width="2"/>
  <text x="555" y="726" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2c22">Test set (4,000)</text>
  <text x="555" y="745" text-anchor="middle" font-size="11" fill="#555555">sealed; no resampling</text>
  <text x="555" y="762" text-anchor="middle" font-size="11" fill="#555555">and no scaling fitted on it</text>

  <line x1="205" y1="774" x2="205" y2="806" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Per-fold treatment -->
  <rect x="60" y="812" width="290" height="82" rx="8" fill="#eafbf0" stroke="#2e6b46" stroke-width="2"/>
  <text x="205" y="834" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f4a30">Inside each CV fold</text>
  <text x="205" y="852" text-anchor="middle" font-size="11" fill="#555555">1. scaler fitted on fold training part</text>
  <text x="205" y="868" text-anchor="middle" font-size="11" fill="#555555">2. resampling applied to it only</text>
  <text x="205" y="884" text-anchor="middle" font-size="11" fill="#555555">3. classifier trained</text>

  <!-- Test set held back arrow to final evaluation -->
  <path d="M 555 774 L 555 920 L 380 920 L 380 946" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowred)"/>
  <text x="575" y="850" font-size="11" font-weight="bold" font-style="italic" fill="#b03a2e">held back until</text>
  <text x="575" y="866" font-size="11" font-weight="bold" font-style="italic" fill="#b03a2e">final evaluation</text>

  <path d="M 205 894 L 205 920 L 380 920" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- Final -->
  <rect x="190" y="952" width="380" height="38" rx="8" fill="#f3eafb" stroke="#5a3d7a" stroke-width="2"/>
  <text x="380" y="976" text-anchor="middle" font-size="13" fill="#1a1a1a">Final evaluation on the untouched test set</text>
</svg>
